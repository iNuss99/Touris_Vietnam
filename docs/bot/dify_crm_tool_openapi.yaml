openapi: 3.0.0
info:
  title: Touris Vietnam CRM Lead Capture API
  description: Công cụ tự động đồng bộ khách hàng tiềm năng và nhật ký cuộc hội thoại từ Dify AI Agent vào hệ thống CRM Touris Vietnam.
  version: 1.0.0
servers:
  - url: https://touris-vietnam-api.vercel.app
    description: Production Server (Vercel)
  - url: http://localhost:5000
    description: Local Development Server
paths:
  /api/leads:
    post:
      operationId: saveLeadToCRM
      summary: Lưu thông tin khách hàng và nhật ký chat vào CRM
      description: Gọi công cụ này khi khách hàng cung cấp Số điện thoại / Zalo hoặc Họ tên để chuyên viên tư vấn liên hệ lại.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                full_name:
                  type: string
                  description: Họ và tên của khách hàng (VD: Anh Khoa, Chị Lan).
                  example: "Anh Minh Khoa"
                phone:
                  type: string
                  description: Số điện thoại hoặc Zalo của khách hàng.
                  example: "0931143830"
                email:
                  type: string
                  description: Email liên hệ của khách hàng (nếu có).
                  example: "khachhang@gmail.com"
                destination:
                  type: string
                  description: Điểm đến du lịch khách quan tâm (Hạ Long, Phú Quốc, Sapa, Hội An, Đà Nẵng, Tràng An...).
                  example: "Hạ Long"
                departure_date:
                  type: string
                  description: Ngày khởi hành dự kiến (VD: 15/08/2026 hoặc Cuối tháng 8).
                  example: "15/08/2026"
                guests:
                  type: integer
                  description: Số lượng người đi trong đoàn.
                  example: 4
                service_class:
                  type: string
                  description: Hạng dịch vụ (Explorer, Signature, Prestige hoặc 3 sao, 4 sao, 5 sao).
                  example: "Prestige (5 sao)"
                message:
                  type: string
                  description: Lời nhắn, ghi chú hoặc yêu cầu đặc biệt của khách (ăn chay, view biển, kỷ niệm ngày cưới...).
                  example: "Gia đình có 2 trẻ nhỏ, cần phòng view biển"
                source:
                  type: string
                  default: "chatbox"
                  description: Nguồn lead (luôn để là chatbox để hệ thống CRM phân loại đúng tab Bot AI).
                  example: "chatbox"
                chat_transcript:
                  type: string
                  description: Toàn bộ lịch sử hội thoại gần nhất giữa AI và Khách hàng để Sale nắm ngữ cảnh.
                  example: "[10:00] Khách: Em muốn hỏi tour Hạ Long\n[10:01] An AI: Dạ tour Hạ Long bên em có du thuyền 5 sao..."
      responses:
        '201':
          description: Lưu thông tin Lead thành công vào hệ thống CRM
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  lead:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 135
                      full_name:
                        type: string
                        example: "Anh Minh Khoa"
                      phone:
                        type: string
                        example: "0931143830"
                      grade:
                        type: string
                        example: "HOT"
                      score:
                        type: integer
                        example: 85
        '500':
          description: Lỗi máy chủ
